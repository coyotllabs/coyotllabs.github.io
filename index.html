<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coyotl Labs</title>
<style>
  :root{--fondo:#12100e;--tinta:#efe8dc;--suave:#b8ad9c;--acento:#9fd35a;--borde:#2c2620}
  *{box-sizing:border-box}
  body{margin:0;background:var(--fondo);color:var(--tinta);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:820px;margin:0 auto;padding:56px 20px 80px}
  h1{font-size:40px;margin:0;letter-spacing:.5px} .lema{color:var(--suave);margin:4px 0 40px}
  .juego{display:flex;gap:20px;align-items:center;padding:18px;border:1px solid var(--borde);border-radius:16px;background:#1a1612}
  .juego img{width:96px;height:96px;border-radius:22px;flex:none}
  .juego h2{margin:0 0 4px;font-size:22px} .juego p{margin:0 0 8px;color:var(--suave)}
  a{color:var(--acento)} footer{margin-top:56px;color:var(--suave);font-size:14px}
  @media (max-width:520px){ .juego{flex-direction:column;align-items:flex-start} }
</style>
</head>
<body><main>
<h1>Coyotl Labs</h1>
<p class="lema">Estudio independiente de juegos y apps · Nezahualcóyotl, México</p>
<div class="juego">
  <img src="icono.png" alt="Ícono de Horda del Tiempo">
  <div>
    <h2>Horda del Tiempo</h2>
    <p>Defiende tu refugio de la horda zombie a través de cinco épocas, del Viejo Oeste al futuro cuántico.</p>
    <a href="https://play.google.com/store/apps/details?id=com.coyotllabs.hordadeltiempo">Google Play</a> · <a href="privacidad.html">Política de privacidad</a>
  </div>
</div>
<footer>Contacto: <a href="mailto:coyotllabs@gmail.com">coyotllabs@gmail.com</a></footer>
</main></body>
</html>
